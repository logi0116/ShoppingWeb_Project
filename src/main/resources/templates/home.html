<!DOCTYPE html>
<html lang="ko"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Store - 메인</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>

<body>
<header class="header">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <!-- 로고 -->
        <div class="logo">
            <h1><a href="/home" class="text-decoration-none text-dark">Fashion Store</a></h1>
        </div>

        <!-- 검색창 -->
        <div class="search-container d-flex">
            <input type="text" id="searchInput" placeholder="상품을 검색하세요..." class="form-control me-2">
            <button class="btn btn-outline-primary">검색</button>
        </div>

        <!-- 네비게이션 버튼 -->
        <div class="nav-buttons d-flex align-items-center gap-2">

            <!-- 공통 버튼 -->
            <button class="btn btn-outline-secondary" onclick="goToMyPage()">마이페이지</button>
            <button class="btn btn-outline-secondary" onclick="goToCart()">
                장바구니 (<span id="cartCount">0</span>)
            </button>

            <!-- 로그인 상태일 때 -->
            <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                <span sec:authentication="name" class="fw-bold text-primary"></span>
                <a href="/logout" class="btn btn-outline-danger btn-sm">로그아웃</a>
            </div>

            <!-- 비로그인 상태일 때 -->
            <div sec:authorize="!isAuthenticated()" class="d-flex gap-2">
                <button onclick="goToLogin()" class="btn btn-outline-primary btn-sm">로그인</button>
                <button onclick="goToSignup()" class="btn btn-outline-success btn-sm">회원가입</button>
            </div>

            <!-- 관리자 전용 버튼 -->
            <div sec:authorize="hasRole('ADMIN')" class="d-flex flex-column align-items-start ms-3">
                <span class="text-danger fw-bold">관리자 계정입니다</span>
                <div class="d-flex gap-2 mt-1">
                    <a href="/admin" class="btn btn-warning btn-sm">관리자 페이지</a>
                    <a href="/admin/products/register" class="btn btn-success btn-sm">상품 등록</a>
                </div>
            </div>

        </div>
    </div>
</header>

<main class="main">
    <div class="container">
        <section class="categories">
            <h2>카테고리</h2>
            <div class="category-grid">
                <div class="category-card" data-category="하의">
                    <h3>바지</h3>
                    <p>편안한 바지 컬렉션</p>
                </div>
                <div class="category-card" data-category="신발">
                    <h3>신발</h3>
                    <p>스타일리시한 신발</p>
                </div>
                <div class="category-card" data-category="상의">
                    <h3>상의</h3>
                    <p>트렌디한 상의</p>
                </div>
                <div class="category-card" data-category="아우터">
                    <h3>아우터</h3>
                    <p>따뜻한 아우터</p>
                </div>
                <div class="category-card" data-category="원피스">
                    <h3>원피스</h3>
                    <p>지금 아니면 못사즌 원피스</p>
                </div>
                <div class="category-card" data-category="가방">
                    <h3>가방</h3>
                    <p>아직도 백팩 매고 다니게?</p>
                </div>
                <div class="category-card" data-category="액세서리">
                    <h3>악세서리</h3>
                    <p>악세서리 하나만으로 분위기를 다르게</p>
                </div>
                <div class="category-card" data-category="기타">
                    <h3>기타/알 수 없음</h3>
                    <p>다른 쇼핑몰 갈 필요 없이 여기서 원클릭으로!</p>
                </div>
            </div>
        </section>

        <section class="products">
            <div class="products-header">
                <h2>상품 목록</h2>
                <button class="show-all-btn">전체 보기</button>
            </div>
            <div class="product-grid" id="productGrid">
                <!-- 상품들이 JavaScript로 동적 생성됩니다 -->
            </div>
            <div class="pagination" id="pagination">
                <!-- 페이지 번호가 여기에 생성됩니다 -->
            </div>
        </section>
    </div>
</main>

<footer class="footer">
    <div class="container">
        <p>&copy; 2024 Fashion Store. All rights reserved.</p>
    </div>
</footer>

<script layout:fragment="script" th:inline="javascript">
    // ==================================================
    // 상태 관리 변수
    // ==================================================
    let currentPage = 1;
    let currentKeyword = "";
    let currentCategory = "";
    let currentUser = null; // 현재 로그인 사용자 정보를 담을 변수

    // ==================================================
    // 초기화 및 이벤트 리스너
    // ==================================================
    document.addEventListener('DOMContentLoaded', function () {
        fetchCurrentUser(); // 현재 사용자 정보 먼저 가져오기
        fetchProducts();
        updateCartCount();
        setupEventListeners();
    });

    function setupEventListeners() {
        const searchButton = document.querySelector(".search-container button");
        searchButton.onclick = () => {
            const searchInput = document.getElementById("searchInput");
            currentKeyword = searchInput.value.trim();
            currentCategory = "";
            fetchProducts(1);
        };

        const searchInput = document.getElementById("searchInput");
        searchInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchButton.click();
            }
        });

        document.querySelectorAll(".category-card").forEach(card => {
            card.onclick = () => {
                currentKeyword = "";
                currentCategory = card.getAttribute("data-category");
                fetchProducts(1);
            };
        });

        document.querySelector(".show-all-btn").onclick = () => {
            currentKeyword = "";
            currentCategory = "";
            document.getElementById("searchInput").value = "";
            fetchProducts(1);
        };
    }

    // ==================================================
    // API 호출 및 데이터 처리
    // ==================================================
    function fetchProducts(page = 1) {
        currentPage = page;
        let apiUrl = `/api/products?page=${page}`;
        if (currentKeyword) {
            apiUrl += `&type=n&keyword=${encodeURIComponent(currentKeyword)}`;
        } else if (currentCategory) {
            apiUrl += `&type=t&keyword=${encodeURIComponent(currentCategory)}`;
        }

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                displayProducts(data.dtoList);
                renderPagination(data);
            })
            .catch(error => {
                console.error('Fetch Error:', error);
                document.getElementById('productGrid').innerHTML = '<p>상품을 불러오는 데 실패했습니다.</p>';
                document.getElementById('pagination').innerHTML = '';
            });
    }

    // ==================================================
    // UI 렌더링
    // ==================================================
    function displayProducts(products) {
        const productGrid = document.getElementById('productGrid');
        productGrid.innerHTML = '';
        if (!products || products.length === 0) {
            productGrid.innerHTML = '<p>상품이 없습니다.</p>';
            return;
        }
        products.forEach(product => {
            const productCard = document.createElement('div');
            productCard.className = 'product-card';
            productCard.innerHTML = `
                <img src="${product.thumbnailFileName ? '/api/image/display/' + product.thumbnailFileName : '/images/default_product.png'}"
                     alt="${product.productName}" class="product-image" onclick="goToProductDetail(${product.productId})"/>
                <div class="product-info">
                    <h3 onclick="goToProductDetail(${product.productId})">${product.productName}</h3>
                    <p>카테고리: ${product.productTag}</p>
                    <div class="product-price">${Number(product.price).toLocaleString()}원</div>
                    <button class="add-to-cart-btn" onclick="addToCart(${product.productId}, '${product.productName}')">
                        장바구니 담기
                    </button>
                </div>
            `;
            productGrid.appendChild(productCard);
        });
    }

    function renderPagination(pageData) {
        const paginationContainer = document.getElementById("pagination");
        paginationContainer.innerHTML = "";

        if (!pageData || !pageData.pageNumList) return;

        if (pageData.prev) {
            const prevBtn = document.createElement("a");
            prevBtn.href = "#";
            prevBtn.innerText = "이전";
            prevBtn.onclick = (e) => { e.preventDefault(); fetchProducts(pageData.prevPage); };
            paginationContainer.appendChild(prevBtn);
        }

        pageData.pageNumList.forEach((pageNum) => {
            const pageBtn = document.createElement("a");
            pageBtn.href = "#";
            pageBtn.innerText = pageNum;
            pageBtn.className = "page-link";
            if (pageNum === pageData.current) {
                pageBtn.classList.add("active");
            }
            pageBtn.onclick = (e) => { e.preventDefault(); fetchProducts(pageNum); };
            paginationContainer.appendChild(pageBtn);
        });

        if (pageData.next) {
            const nextBtn = document.createElement("a");
            nextBtn.href = "#";
            nextBtn.innerText = "다음";
            nextBtn.onclick = (e) => { e.preventDefault(); fetchProducts(pageData.nextPage); };
            paginationContainer.appendChild(nextBtn);
        }
    }

    // ==================================================
    // 유틸리티 함수
    // ==================================================
    function updateCartCount() {
        fetch('/api/cart')
            .then(res => {
                if (res.status === 401) return { length: 0 };
                if (!res.ok) return { length: 0 };
                return res.json();
            })
            .then(data => {
                document.getElementById('cartCount').textContent = data ? data.length : 0;
            })
            .catch(err => {
                document.getElementById('cartCount').textContent = 0;
            });
    }

    async function addToCart(productId, productName) {
        try {
            const response = await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId: productId, quantity: 1 }),
                redirect: 'manual' // 리다이렉트를 수동으로 처리
            });

            // type 'opaqueredirect'는 CORS 정책 등으로 인해 리다이렉트 응답을 받았으나,
            // 스크립트가 응답의 상세 내용을 볼 수 없을 때 발생합니다.
            // Spring Security의 로그인 리다이렉트가 이 경우에 해당합니다.
            if (response.type === 'opaqueredirect' || response.status === 401) {
                alert("로그인이 필요합니다.");
                window.location.href = "/login";
                return;
            }

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '장바구니 추가에 실패했습니다.');
            }

            alert(`🛒 ${productName}이(가) 장바구니에 추가되었습니다.`);
            await updateCartCount();

        } catch (err) {
            console.error(err);
            alert('장바구니 추가 중 오류가 발생했습니다.');
        }
    }

    function goToProductDetail(productId) { window.location.href = `/products/${productId}`; }
    function goToCart() { window.location.href = '/cart'; }
    function goToMyPage() { window.location.href = '/mypage'; }
    function goToLogin() { window.location.href = '/login'; }
    function goToSignup() { window.location.href = '/signup'; }

    async function fetchCurrentUser() {
        try {
            const res = await fetch('/api/members/me');
            if (!res.ok) throw new Error("비로그인 상태");
            currentUser = await res.json();
            console.log("로그인 사용자:", currentUser);
        } catch (err) {
            console.warn(err.message);
            currentUser = null;
        }
    }
</script>
<script src="/js/script.js"></script>
</body>
</html>
