<!DOCTYPE html>
<html
  lang="ko"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Store - 메인</title>
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <h1><a href="/home">Fashion Store</a></h1>
        </div>
        <nav class="nav">
          <div class="search-container">
            <input
              type="text"
              id="searchInput"
              placeholder="상품을 검색하세요..."
            />
            <button onclick="searchProducts()">검색</button>
          </div>
          <div class="nav-buttons">
            <button onclick="goToMyPage()">마이페이지</button>
            <button onclick="goToCart()">
              장바구니 (<span id="cartCount">0</span>)
            </button>
            <button onclick="goToLogin()" id="loginBtn">로그인</button>
            <button onclick="goToSignup()">회원가입</button>
            <button onclick="logout()" id="logoutBtn" style="display: none">
              로그아웃
            </button>
          </div>
        </nav>
      </div>
    </header>

    <main class="main">
      <div class="container">
        <section class="categories">
          <h2>카테고리</h2>
          <div class="category-grid">
            <div class="category-card" data-category="BOTTOM">
              <h3>바지</h3>
              <p>편안한 바지 컬렉션</p>
            </div>
            <div class="category-card" data-category="SHOES">
              <h3>신발</h3>
              <p>스타일리시한 신발</p>
            </div>
            <div class="category-card" data-category="TOP">
              <h3>상의</h3>
              <p>트렌디한 상의</p>
            </div>
            <div class="category-card" data-category="OUTER">
              <h3>아우터</h3>
              <p>따뜻한 아우터</p>
            </div>
            <div class="category-card" data-category="DRESS">
              <h3>원피스</h3>
              <p>지금 아니면 못사즌 원피스</p>
            </div>
            <div class="category-card" data-category="BAG">
              <h3>가방</h3>
              <p>아직도 백팩 매고 다니게?</p>
            </div>
            <div class="category-card" data-category="ACC">
              <h3>악세서리</h3>
              <p>악세서리 하나만으로 분위기를 다르게</p>
            </div>
            <div class="category-card" data-category="UNKNOWN">
              <h3>기타/알 수 없음</h3>
              <p>다른 쇼핑몰 갈 필요 없이 여기서 원클릭으로!</p>
            </div>
          </div>
        </section>

        <section class="products">
          <div class="products-header">
            <h2>상품 목록</h2>
            <button onclick="showAllProducts()" class="show-all-btn">
              전체 보기
            </button>
          </div>
          <div class="product-grid" id="productGrid">
            <!-- 상품들이 JavaScript로 동적 생성됩니다 -->
          </div>
        </section>
        <div class="pagination" id="pagination">
          <!-- 페이지 번호가 동적으로 생성됩니다 -->
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2024 Fashion Store. All rights reserved.</p>
      </div>
    </footer>

    <script layout:fragment="script" th:inline="javascript">
      // 모든 상품 로딩 및 페이징 관련 로직은 product-paging.js로 이전되었습니다.
      // 이 공간에는 페이징과 직접 관련 없는 함수들만 남겨둡니다.

      function goToProductDetail(productId) {
        window.location.href = `/products/${productId}`;
      }

      function addToCart(productId) {
        const payload = {
          productId: productId,
          memberId: 1, // 임시 회원 ID
          quantity: 1,
        };

        fetch("/api/cart", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(payload),
        })
          .then((res) => {
            if (!res.ok) {
              throw new Error("장바구니 추가에 실패했습니다.");
            }
            return res.json();
          })
          .then((data) => {
            alert(`🛒 ${data.productName}이(가) 장바구니에 추가되었습니다.`);
            // script.js의 updateUI 함수를 호출하여 장바구니 카운트 업데이트
            if (typeof updateUI === "function") {
              updateUI();
            }
          })
          .catch((err) => {
            console.error(err);
            alert("장바구니 추가 중 오류가 발생했습니다.");
          });
      }

      // 카테고리 클릭, 전체 보기, 검색 버튼 클릭은
      // 이제 product-paging.js에서 자체적으로 이벤트 리스너를 설정하여 처리합니다.
      // 따라서 아래 함수들은 더 이상 필요하지 않으며, onclick 속성도 제거하는 것이 좋습니다.
      function filterByCategory(category) {}
      function showAllProducts() {}
      function searchProducts() {}
    </script>
    <script src="/js/script.js"></script>
    <script src="/js/product-paging.js"></script>
  </body>
</html>
