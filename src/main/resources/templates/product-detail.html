<!DOCTYPE html>
<html
  lang="ko"
  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:th="http://www.thymeleaf.org"
>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion Store - 상품 상세</title>
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
</head>
<body>
<header class="header bg-light border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="logo">
            <h1 class="h4 mb-0">
                <a th:href="@{/home}" class="text-decoration-none text-dark">Fashion Store</a>
            </h1>
        </div>
        <nav class="nav">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-primary btn-sm" onclick="goToMyPage()">마이페이지</button>
                <button class="btn btn-outline-success btn-sm" onclick="goToCart()">
                    장바구니 (<span id="cartCount">0</span>)
                </button>
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
                    <span class="text-muted small" sec:authentication="name">사용자 이메일</span>
                    <a href="/logout" class="btn btn-outline-danger btn-sm">로그아웃</a>
                </div>
                <div sec:authorize="!isAuthenticated()" class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-secondary btn-sm" onclick="goToLogin()" id="loginBtn">로그인</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="goToSignup()">회원가입</button>
                </div>
            </div>
        </nav>
    </div>
</header>

<main class="main">
    <div class="container">
        <button class="back-btn" onclick="goBack()">
            ← 상품 목록으로
        </button>
        <div class="product-detail-container">
            <div class="product-detail-grid">
                <div class="product-image-large" id="productImageLarge"></div>
                <div class="product-info-detail">
                    <div class="product-category" id="productCategory"></div>
                    <h1 class="product-title" id="productTitle"></h1>
                    <div class="product-price-large" id="productPriceLarge"></div>
                    <div class="rating-info">
                        <div class="stars" id="averageStars"></div>
                        <span class="rating-score" id="averageRating">0.0</span>
                        <span class="review-count" id="reviewCount">(0개 리뷰)</span>
                    </div>
                    <div class="product-description">
                        <h3>상품 설명</h3>
                        <p id="productDescription"></p>
                    </div>
                    <button class="add-to-cart-btn-large" onclick="addToCartFromDetail()">
                        🛒 장바구니 담기
                    </button>
                </div>
            </div>
        </div>
        <div class="product-detail-images" id="productDetailImages"></div>
        <div class="review-section">
            <h2>상품 리뷰</h2>

            <!-- 리뷰 작성 폼 (조건부 표시) -->
            <div class="review-write-container" id="reviewWriteContainer" style="display: none;">
                <div class="review-write-card">
                    <h3>리뷰 작성</h3>
                    <form id="reviewForm" onsubmit="submitReview(event)">
                        <div class="form-group">
                            <label>평점</label>
                            <div class="star-rating" id="starRating">
                                <span class="star" data-rating="1">★</span>
                                <span class="star" data-rating="2">★</span>
                                <span class="star" data-rating="3">★</span>
                                <span class="star" data-rating="4">★</span>
                                <span class="star" data-rating="5">★</span>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>리뷰 내용</label>
                            <textarea id="reviewComment" placeholder="상품에 대한 솔직한 후기를 남겨주세요." rows="4" required></textarea>
                        </div>
                        <button type="submit" class="submit-review-btn">리뷰 등록</button>
                    </form>
                </div>
            </div>

            <!-- 안내 메시지 영역 (조건부 표시) -->
            <div class="info-message-card" id="infoMessage" style="display: none;">
                <p id="infoMessageText"></p>
            </div>

            <div class="review-list" id="reviewList"></div>
            <div class="pagination" id="reviewPagination"></div>
        </div>
    </div>
</main>

<script th:src="@{/js/script.js}"></script>
<script th:inline="javascript">
    let currentUser = null;
    let currentProduct = null;
    // selectedRating은 script.js에 전역 변수로 선언되어 있으므로 여기서는 제거합니다.

    document.addEventListener('DOMContentLoaded', async () => {
        await initializePage();
    });

    async function initializePage() {
        await fetchCurrentUser();
        await initializeProductDetail();
        await setupReviewSection();
        await updateCartCountFromServer();
    }

    async function fetchCurrentUser() {
        try {
            const res = await fetch('/api/members/me');
            if (!res.ok) throw new Error("비로그인 상태");
            currentUser = await res.json();
        } catch (err) {
            currentUser = null;
        }
    }

    async function initializeProductDetail() {
        const pathSegments = window.location.pathname.split('/');
        const productId = pathSegments[pathSegments.length - 1];
        if (!productId) { window.location.href = '/home'; return; }

        try {
            const res = await fetch(`/api/products/${productId}`);
            if (!res.ok) throw new Error('상품 정보를 불러오지 못했습니다.');
            currentProduct = await res.json();
            displayProductDetail(currentProduct);
            displayProductReviews(currentProduct.productId, 1);
        } catch (err) {
            alert(err.message);
            window.location.href = "/";
        }
    }

    function displayProductDetail(product) {
        const productImageLarge = document.getElementById('productImageLarge');
        const imageUrl = product.thumbnailFileName ? `/api/image/display/${product.thumbnailFileName}` : '/images/default_product.png';
        productImageLarge.innerHTML = `<img src="${imageUrl}" alt="${product.productName}">`;
        document.getElementById('productCategory').textContent = product.productTag;
        document.getElementById('productTitle').textContent = product.productName;
        document.getElementById('productPriceLarge').textContent = Number(product.price).toLocaleString() + '원';
        document.getElementById('productDescription').textContent = '고품질 상품입니다.';

        const starsContainer = document.getElementById("averageStars");
        const ratingScore = document.getElementById("averageRating");
        const reviewCount = document.getElementById("reviewCount");
        starsContainer.innerHTML = renderStars(Math.round(product.averageRating));
        ratingScore.textContent = product.averageRating.toFixed(1);
        reviewCount.textContent = `(${product.reviewCount}개 리뷰)`;

        const container = document.getElementById('productDetailImages');
        container.innerHTML = '';
        if (!product.fileNames || product.fileNames.length === 0) {
            container.innerHTML = '<p>상세 이미지가 없습니다.</p>';
        } else {
            product.fileNames.forEach(fileName => {
                const img = document.createElement('img');
                img.src = `/api/image/display/${fileName}`;
                img.alt = '제품 상세 이미지';
                container.appendChild(img);
            });
        }
    }

    async function setupReviewSection() {
        const reviewWriteContainer = document.getElementById("reviewWriteContainer");
        const infoMessage = document.getElementById("infoMessage");
        const infoMessageText = document.getElementById("infoMessageText");

        if (currentUser) {
            try {
                const res = await fetch(`/api/reviews/check-purchase?productId=${currentProduct.productId}`);
                const hasPurchased = await res.json();

                if (hasPurchased) {
                    reviewWriteContainer.style.display = "block";
                    infoMessage.style.display = "none";
                    initializeStarRating();
                } else {
                    reviewWriteContainer.style.display = "none";
                    infoMessageText.textContent = "이 상품을 구매한 사용자만 리뷰를 작성할 수 있습니다.";
                    infoMessage.style.display = "block";
                }
            } catch (err) {
                console.error("구매 여부 확인 중 오류:", err);
                reviewWriteContainer.style.display = "none";
                infoMessageText.textContent = "리뷰 정보를 확인하는 중 오류가 발생했습니다.";
                infoMessage.style.display = "block";
            }
        } else {
            reviewWriteContainer.style.display = "none";
            infoMessageText.textContent = "리뷰를 작성하려면 로그인이 필요합니다.";
            infoMessage.style.display = "block";
        }
    }

    function initializeStarRating() {
        const stars = document.querySelectorAll(".star-rating .star");
        stars.forEach((star, index) => {
            star.addEventListener("click", () => {
                selectedRating = index + 1; // script.js의 전역 변수 사용
                updateStarRating();
            });
        });
        updateStarRating();
    }

    function updateStarRating() {
        const stars = document.querySelectorAll('.star-rating .star');
        stars.forEach((star, index) => {
            star.classList.toggle('active', index < selectedRating); // script.js의 전역 변수 사용
        });
    }

    async function submitReview(event) {
        event.preventDefault();
        const comment = document.getElementById('reviewComment').value.trim();
        if (!comment) {
            alert('리뷰 내용을 입력해주세요.');
            return;
        }

        const reviewDTO = {
            productId: currentProduct.productId,
            reviewContent: comment,
            rating: selectedRating // script.js의 전역 변수 사용
        };

        try {
            const res = await fetch('/api/reviews', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(reviewDTO)
            });

            if (res.status === 403) {
                const errorMessage = await res.text();
                alert(errorMessage);
                return;
            }
            if (!res.ok) {
                throw new Error('리뷰 등록에 실패했습니다.');
            }

            alert('리뷰가 성공적으로 등록되었습니다.');
            document.getElementById('reviewComment').value = '';
            selectedRating = 5; // 기본값으로 리셋
            updateStarRating();
            displayProductReviews(currentProduct.productId, 1);
        } catch (err) {
            console.error("리뷰 제출 오류:", err);
            alert(err.message);
        }
    }

    function displayProductReviews(productId, page) {
        const reviewList = document.getElementById("reviewList");
        fetch(`/api/reviews/${productId}?page=${page}`)
          .then(res => res.json())
          .then(pageData => {
              if (!pageData.dtoList || pageData.dtoList.length === 0) {
                  reviewList.innerHTML = `<div class="no-reviews"><p>아직 리뷰가 없습니다.</p></div>`;
              } else {
                  reviewList.innerHTML = "";
                  pageData.dtoList.forEach(review => {
                      const reviewItem = document.createElement("div");
                      reviewItem.className = "review-item";
                      const formattedDate = review.createdAt ? review.createdAt.substring(0, 10) : "N/A";
                      reviewItem.innerHTML = `
                          <div class="review-header">
                              <div class="review-user-info">
                                  <div class="review-user-name">${review.memberName || '사용자'}</div>
                                  <div class="review-date">${formattedDate}</div>
                              </div>
                              <div class="review-rating">${renderStars(review.rating)}</div>
                          </div>
                          <div class="review-comment">${review.reviewContent}</div>
                      `;
                      reviewList.appendChild(reviewItem);
                  });
              }
              renderReviewPagination(productId, pageData);
          })
          .catch(err => {
              reviewList.innerHTML = `<div class="no-reviews"><p>리뷰를 불러오는 중 오류가 발생했습니다.</p></div>`;
          });
    }

    function renderReviewPagination(productId, pageData) {
        const pagination = document.getElementById("reviewPagination");
        pagination.innerHTML = "";
        if (!pageData || !pageData.pageNumList) return;

        if (pageData.prev) {
            const prevBtn = document.createElement("a");
            prevBtn.href = "#";
            prevBtn.innerText = "이전";
            prevBtn.onclick = (e) => { e.preventDefault(); displayProductReviews(productId, pageData.prevPage); };
            pagination.appendChild(prevBtn);
        }
        pageData.pageNumList.forEach(pageNum => {
            const pageBtn = document.createElement("a");
            pageBtn.href = "#";
            pageBtn.innerText = pageNum;
            pageBtn.className = "page-link";
            if (pageNum === pageData.current) {
                pageBtn.classList.add("active");
            }
            pageBtn.onclick = (e) => { e.preventDefault(); displayProductReviews(productId, pageNum); };
            pagination.appendChild(pageBtn);
        });
        if (pageData.next) {
            const nextBtn = document.createElement("a");
            nextBtn.href = "#";
            nextBtn.innerText = "다음";
            nextBtn.onclick = (e) => { e.preventDefault(); displayProductReviews(productId, pageData.nextPage); };
            pagination.appendChild(nextBtn);
        }
    }

    function renderStars(rating) {
        let starsHTML = '';
        for (let i = 1; i <= 5; i++) {
            starsHTML += `<span class="star ${i <= rating ? 'active' : ''}">★</span>`;
        }
        return starsHTML;
    }

    function addToCartFromDetail() {
        if (!currentProduct) return;
        addToCart(currentProduct.productId, currentProduct.productName);
    }

    // 유틸리티 함수들
    function goBack() { window.history.back(); }
    function goToMyPage() { window.location.href = '/mypage'; }
    function goToCart() { window.location.href = '/cart'; }
    function goToLogin() { window.location.href = '/login'; }
    function goToSignup() { window.location.href = '/signup'; }

    async function updateCartCountFromServer() {
        const cartCountSpan = document.getElementById('cartCount');
        if (!cartCountSpan) return;

        if (currentUser) {
            try {
                const response = await fetch('/api/cart/count'); // 이 API는 개수만 반환한다고 가정
                if (!response.ok) throw new Error('Failed to fetch cart count');
                const data = await response.json();
                cartCountSpan.textContent = data.count || 0;
            } catch (error) {
                console.error("Error fetching cart count:", error);
                cartCountSpan.textContent = '0';
            }
        } else {
            cartCountSpan.textContent = '0';
        }
    }

    async function addToCart(productId, productName) {
        if (!currentUser) {
            alert("로그인이 필요합니다.");
            window.location.href = '/login';
            return;
        }

        const cartItemDTO = {
            productId: productId,
            quantity: 1
        };

        try {
            const response = await fetch('/api/cart', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cartItemDTO)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '장바구니 추가에 실패했습니다.');
            }

            alert(`${productName}이(가) 장바구니에 추가되었습니다.`);
            await updateCartCountFromServer();

        } catch (error) {
            console.error('Error adding to cart:', error);
            alert(error.message);
        }
    }
</script>
</body>
</html>
