//순서1 Querydsl 사용하기 위한 변수 설정.
buildscript {
    ext {
        queryDslVersion = "5.0.0"
    }
}
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.busanit501'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 부트 프로젝트 생성 후 , 개별 설정

    //롬복, 테스트 환경에서 동작하기.
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //타임리프 설정, 공통 레이아웃 도구
    implementation group: 'nz.net.ultraq.thymeleaf', name: 'thymeleaf-layout-dialect', version: '3.1.0'

    // queryDsl설치 순서 2)  동적 sql을 다루고 빌드 패턴을 이용하고, 자바의 컴파일러 문법 체크 도움도 받기
    implementation "com.querydsl:querydsl-jpa:${queryDslVersion}:jakarta"
    // queryDsl설치 순서 3) Querydsl 설정.
    annotationProcessor(
            "jakarta.persistence:jakarta.persistence-api",
            "jakarta.annotation:jakarta.annotation-api",
            "com.querydsl:querydsl-apt:${queryDslVersion}:jakarta"
    )

    // 5, DTO <-> VO(엔티티클래스) 변환기, 필요. ModelMapper
    implementation group: 'org.modelmapper', name: 'modelmapper', version: '3.2.4'

    //6
    // 서버 입장에서 입력된 데이터 유효성 검증 도구
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.4.0'

    //7
    // Rest테스트 도구
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.7.0'


    // 8
    // 원본 이미지 -> 작은 이미지 변환 도구,
    // https://mvnrepository.com/artifact/net.coobird/thumbnailator
    implementation group: 'net.coobird', name: 'thumbnailator', version: '0.4.20'

    // 9, 시큐리티 설정
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: '3.5.3'

    // 10, 타임리프 , 시큐리티 연동 설정
    // https://mvnrepository.com/artifact/org.thymeleaf.extras/thymeleaf-extras-springsecurity6
    implementation group: 'org.thymeleaf.extras', name: 'thymeleaf-extras-springsecurity6', version: '3.1.2.RELEASE'

    // 11, 카카오 로그인, Oauth2 도구 설치.
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-oauth2-client', version: '3.5.3'
}

tasks.named('test') {
    useJUnitPlatform()
}
// queryDsl설치 순서 4)
// QueryDSL 설정: 생성된 Q-Type 클래스들의 출력 디렉토리를 지정하고,
// 컴파일 시 해당 디렉토리를 소스 폴더로 포함시켜주는 설정입니다.
// 이렇게 하면 패키지 경로 문제가 해결되고, IDE가 Q-Type을 정상적으로 인식할 수 있게 됩니다.
def querydslDir = "$buildDir/generated/querydsl"

sourceSets {
    main.java.srcDirs += [ querydslDir ]
}

tasks.withType(JavaCompile) {
    options.getGeneratedSourceOutputDirectory().set(file(querydslDir))
}

clean.doLast {
    delete file(querydslDir)
}

